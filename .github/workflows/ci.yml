name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: linux / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: 构建与测试
        run: |
          make CC=${{ matrix.cc }} CFLAGS="-O2"
          make test CC=${{ matrix.cc }} CFLAGS="-O2"

      - name: 边界回归（54936 位、100000 位）
        if: matrix.cc == 'gcc'
        run: make test-slow CC=gcc CFLAGS="-O2"

      - name: ASan + UBSan
        if: matrix.cc == 'gcc'
        env:
          SAN: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
        run: |
          make clean
          make CC=gcc CFLAGS="$SAN"
          make test CC=gcc CFLAGS="$SAN"

  windows:
    name: windows / mingw64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
            mingw-w64-x86_64-python

      - name: 构建与测试
        shell: msys2 {0}
        run: |
          make CC=gcc
          make test PYTHON=python
